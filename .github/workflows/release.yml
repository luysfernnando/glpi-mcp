name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: glpi-mcp
            asset: glpi_mcp-${{ github.ref_name }}-x86_64-linux.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            bin: glpi-mcp
            asset: glpi_mcp-${{ github.ref_name }}-aarch64-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: glpi-mcp.exe
            asset: glpi_mcp-${{ github.ref_name }}-x86_64-windows.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: glpi-mcp
            asset: glpi_mcp-${{ github.ref_name }}-x86_64-macos.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: glpi-mcp
            asset: glpi_mcp-${{ github.ref_name }}-aarch64-macos.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.asset }} ${{ matrix.bin }}

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin }} -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          RANGE="${PREV_TAG:+$PREV_TAG..}${{ github.ref_name }}"
          {
            echo "## Changelog"
            echo
            git log --no-merges --pretty=format:"- %h %s" "$RANGE"
          } > CHANGELOG_BODY.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGELOG_BODY.md \
            artifacts/*
